<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#1c1916"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#2a2520" stroke="#d4b15a" stroke-width="2"/>
  <g transform="translate(88, 92) scale(1.15)" fill="#d4b15a">
    <rect x="55" y="8" width="18" height="112" rx="1"/>
    <rect x="8" y="55" width="112" height="18" rx="1"/>
    <rect x="28" y="20" width="8" height="24"/>
    <rect x="20" y="28" width="24" height="8"/>
    <rect x="92" y="20" width="8" height="24"/>
    <rect x="84" y="28" width="24" height="8"/>
    <rect x="28" y="84" width="8" height="24"/>
    <rect x="20" y="92" width="24" height="8"/>
    <rect x="92" y="84" width="8" height="24"/>
    <rect x="84" y="92" width="24" height="8"/>
  </g>
  <text x="270" y="150" fill="#f4efe6" font-family="serif" font-size="36" font-weight="700">Liturgy of the Hours</text>
  <text x="270" y="186" fill="#d4b15a" font-family="sans-serif" font-size="18">Terce · Third Hour · 09:00</text>
  <g font-family="sans-serif" font-size="18" fill="#f4efe6">
    <text x="88" y="280">Lauds</text><text x="280" y="280" fill="#b9b0a4">06:00</text>
    <text x="88" y="318">Prime</text><text x="280" y="318" fill="#b9b0a4">07:00</text>
    <text x="88" y="356" fill="#d4b15a">Terce</text><text x="280" y="356" fill="#d4b15a">09:00</text>
    <text x="88" y="394">Sext</text><text x="280" y="394" fill="#b9b0a4">12:00</text>
    <text x="88" y="432">None</text><text x="280" y="432" fill="#b9b0a4">15:00</text>
    <text x="88" y="470">Vespers</text><text x="280" y="470" fill="#b9b0a4">18:00</text>
  </g>
  <text x="430" y="300" fill="#b9b0a4" font-family="sans-serif" font-size="14" font-weight="700">TODAY’S SCRIPTURE</text>
  <text x="430" y="332" fill="#f4efe6" font-family="serif" font-size="20" font-weight="700">John 14:27</text>
  <text x="430" y="372" fill="#f4efe6" font-family="serif" font-size="17">Peace I leave with you. My peace I</text>
  <text x="430" y="398" fill="#f4efe6" font-family="serif" font-size="17">give to you; not as the world gives,</text>
  <text x="430" y="424" fill="#f4efe6" font-family="serif" font-size="17">give I to you. Don’t let your heart be</text>
  <text x="430" y="450" fill="#f4efe6" font-family="serif" font-size="17">troubled, neither let it be fearful.</text>
</svg>
